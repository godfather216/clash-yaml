port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
external-controller: :9090

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:53
  default-nameserver: [223.5.5.5, 119.29.29.29]
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - localhost.ptlogin2.qq.com
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - https://doh.dns.sb/dns-query
    - https://dns.cloudflare.com/dns-query
    - https://dns.twnic.tw/dns-query
    - tls://8.8.4.4:853
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32

tun:
  enable: true
  stack: system
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true

profile:
  store-selected: true
  store-fake-ip: true
tcp-concurrent: true

proxies:

proxy-groups:
  - name: 节点选择
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple_Fitness+.png
    proxies:
      - 自动选择
      - 手动切换
      - 香港节点
      - 日本节点
      - 美国节点
      - 台湾节点
      - 狮城节点
      - 韩国节点
      - 加入电报群@dizhujiacl
      - DIRECT
  - name: 自动选择
    type: url-test
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Cellular.png
    proxies:
      - 香港节点
      - 日本节点
      - 美国节点
      - 台湾节点
      - 狮城节点
      - 韩国节点
      - 加入电报群@dizhujiacl
  - name: 手动切换
    include-all: true
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Static.png
  - name: TikTok
    include-all: true
    type: select
    filter: (?i)TK
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/TikTok_1.png
  - name: Spotify
    type: select
    icon: https://github.com/shindgewongxj/WHATSINStash/raw/main/icon/spotify.png
    proxies:
      - 节点选择
      - 手动切换
      - 香港节点
      - 日本节点
      - 美国节点
      - 台湾节点
      - 狮城节点
      - 韩国节点
      - 加入电报群@dizhujiacl
  - name: OpenAI
    type: select
    icon: https://github.com/shindgewongxj/WHATSINStash/raw/main/icon/anthropic.png
    proxies:
      - 节点选择
      - 手动切换
      - 日本节点
      - 美国节点
      - 台湾节点
      - 狮城节点
      - 韩国节点
      - 加入电报群@dizhujiacl
  - name: YouTube
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png
    type: select
    proxies:
      - 节点选择
      - 自动选择
      - 手动切换
      - 香港节点
      - 日本节点
      - 美国节点
      - 台湾节点
      - 狮城节点
      - 韩国节点
      - 加入电报群@dizhujiacl
  - name: 加入电报群@dizhujiacl
    include-all: true
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png
  - name: 漏网之鱼
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png
    proxies:
      - 节点选择
      - DIRECT
  - name: 香港节点
    include-all: true
    type: load-balance
    strategy: consistent-hashing
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: (?i)港|hk|🇭🇰|hongkong
  - name: 日本节点
    include-all: true
    type: load-balance
    strategy: consistent-hashing
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: (?i)日本|jp|🇯🇵|japan|东京|大阪|泉日|埼玉|沪日|深日
  - name: 美国节点
    include-all: true
    type: load-balance
    strategy: consistent-hashing
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: (?i)美|us|🇺🇸|united
      states|america|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥
  - name: 台湾节点
    include-all: true
    type: load-balance
    strategy: consistent-hashing
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Taiwan.png
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: (?i)台|新北|彰化|TW|Taiwan|新北|彰化
  - name: 狮城节点
    include-all: true
    type: load-balance
    strategy: consistent-hashing
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: (?i)新加坡|狮城|🇸🇬|sg|singapore
  - name: 韩国节点
    include-all: true
    type: load-balance
    strategy: consistent-hashing
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Korea.png
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: (?i)韩|KR|🇰🇷|korea|首尔|韩|韓

